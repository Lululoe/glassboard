# Glassboard Configuration
# Copy this file to config.yaml and customize it for your setup.
#   cp config.example.yaml config.yaml

theme: "default"
themes: []

# Fill every card with simulated data instead of calling your services, e.g. to try the
# dashboard before setting anything up. Can also be set with GLASSBOARD_DEMO=true.
# demo: true

# Cards can be moved, resized, edited, added and removed in the browser (long-press a card, or the
# pencil button in the header). Changes are saved to layout.yaml, not to this file. There is no login
# yet, so anyone who can open the dashboard can do this. Set to false to turn it off.
# editable: false

pages:
  - id: home
    name: "Home"
    cards:
      - id: weather
        type: weather
        colSpan: 2
        location: "Berlin" # or set latitude/longitude
        # units: imperial # default: metric

      - id: appgrid
        type: appgrid
        colSpan: 1

      - id: lights
        type: hacontrol
        colSpan: 1
        data:
          entities:
            - entity_id: light.living_room
              name: "Living Room"
              icon: "lamp"
              on_action: { service: light.turn_on }
              off_action: { service: light.turn_off }
            - entity_id: light.kitchen
              name: "Kitchen"
              icon: "lamp"
              on_action: { service: light.turn_on }
              off_action: { service: light.turn_off }
            - entity_id: switch.coffee_machine
              name: "Coffee Machine"
              icon: "Coffee"
              on_action: { service: switch.turn_on }
              off_action: { service: switch.turn_off }
            - entity_id: fan.bedroom
              name: "Bedroom Fan"
              icon: "Fan"
              on_action: { service: fan.turn_on }
              off_action: { service: fan.turn_off }

      - id: living_climate
        type: thermostat
        entity_id: climate.living_room
        colSpan: 1
        # Optional: replace the entity's Home Assistant presets
        # presets:
        #   - { name: Comfort, temperature: 21, icon: Sun }
        #   - { name: Eco, preset: eco, icon: Leaf }

      # Several rooms in one card (as rows when one wide, as columns when wider)
      # - id: climate
      #   type: thermostats
      #   colSpan: 2
      #   rooms:
      #     - entity_id: climate.living_room
      #     - entity_id: climate.bedroom

      - id: media_center
        type: media
        colSpan: 2
        primaryColor: "#f078f0"

      - id: transmission
        type: transmission
        colSpan: 3
        url: "http://transmission.local:9091"
        downloadsUrl: "http://downloads.local"
        primaryColor: "#f02520"

  - id: admin
    name: "Server"
    cards:

      - id: server_stats
        type: serverstats
        colSpan: 2
        data:
          sensors: ["cpu", "ram", "storage", "network", "temp"]

      - id: proxmox_cluster
        type: proxmox
        colSpan: 1
        url: "https://proxmox.local:8006"
        primaryColor: "#e57000"

      - id: github_prs
        type: git
        colSpan: 3
        filterStatus: ['open']
        repositories:
          - type: "github"
            owner: "your-username"
            repo: "your-repo"

  # Example: Embed an external page as an iframe
  # - id: example_iframe
  #   name: "Status Page"
  #   type: iframe
  #   url: "https://status.example.com"

